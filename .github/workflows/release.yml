name: release

# Tag a version to cut a release:
#   jj bookmark set main -r @- && jj git push --bookmark main
#   git tag v0.1.0 && git push github v0.1.0     (or jj: jj tag …)
# GoReleaser builds darwin/linux (amd64+arm64) archives, publishes a GitHub
# Release, and updates Formula/pitf.rb in erewhon/homebrew-tap.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT (repo scope) that can push to erewhon/homebrew-tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
