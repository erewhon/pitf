# GoReleaser — builds `pitf` and publishes a Homebrew formula to
# github.com/erewhon/homebrew-tap on every `vX.Y.Z` tag.
# A formula (not a cask) so Homebrew on Linux can install it too.
version: 2

project_name: pitf

before:
  hooks:
    - go mod download

builds:
  - id: pitf
    main: ./cmd/pitf
    binary: pitf
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: pitf
    ids: [pitf]
    name_template: "pitf_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

release:
  github:
    owner: erewhon
    name: pitf

brews:
  - name: pitf
    ids: [pitf]
    repository:
      owner: erewhon
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/erewhon/pitf"
    description: "One command over the smithy LLM tools: agent-monitor, tokenator, llm-router, benchmarks"
    license: "AGPL-3.0-or-later"
    commit_author:
      name: goreleaser-bot
      email: noreply@byrnes.org
    install: |
      bin.install "pitf"
      generate_completions_from_executable(bin/"pitf", "completion")
    caveats: |
      Built in: pitf monitor | tokens | router … | bench sweep | session | model | dashboard | config
      Python tools (need uv + the checkouts under ~/code/smithy or PITF_SMITHY_DIR): pitf qual | forge | meta

      First run: pitf config init, then pitf doctor
