# GoReleaser — builds `pitf` and publishes a Homebrew formula to
# smithy/homebrew-tap on code.middlefork.org on every `vX.Y.Z` tag.
# A formula (not a cask) so Homebrew on Linux can install it too.
version: 2

project_name: pitf

before:
  hooks:
    - go mod download

builds:
  - id: pitf
    main: ./cmd/pitf
    binary: pitf
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: pitf
    ids: [pitf]
    name_template: "pitf_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

release:
  # GitHub releases retired 2026-10-20: binaries are release assets on
  # code.middlefork.org, and the tap is smithy/homebrew-tap there.
  # Cut a release from a workstation (sprinkle-runner has no secrets):
  #   git tag -a vX.Y.Z -m ... && git push code-public vX.Y.Z
  #   MIDDLEFORK_TOKEN=$(ho secret get code-public/release-token) \
  #   TAP_SSH_KEY=~/.ssh/id_ed25519 goreleaser release --clean
  disable: true

publishers:
  - name: middlefork
    checksum: true
    cmd: >-
      curl -fsS -T "{{ .ArtifactPath }}"
      -H "Authorization: token {{ .Env.MIDDLEFORK_TOKEN }}"
      "https://code.middlefork.org/api/v1/repos/smithy/pitf/releases/{{ .Tag }}/assets/{{ .ArtifactName }}"

brews:
  - name: pitf
    ids: [pitf]
    repository:
      owner: smithy
      name: homebrew-tap
      branch: main
      git:
        url: "ssh://code.bcc.sh:23232/smithy/homebrew-tap.git"
        private_key: "{{ .Env.TAP_SSH_KEY }}"
    url_template: "https://code.middlefork.org/api/v1/repos/smithy/pitf/releases/{{ .Tag }}/assets/{{ .ArtifactName }}"
    directory: Formula
    homepage: "https://code.middlefork.org/smithy/pitf"
    description: "One command over the smithy LLM tools: agent-monitor, tokenator, llm-router, benchmarks"
    license: "AGPL-3.0-or-later"
    commit_author:
      name: goreleaser-bot
      email: erewhon@flatland.org
    install: |
      bin.install "pitf"
      generate_completions_from_executable(bin/"pitf", "completion")
    caveats: |
      Built in: pitf monitor | tokens | router … | bench sweep | session | model | dashboard | config
      Python tools (need uv + the checkouts under ~/code/smithy or PITF_SMITHY_DIR): pitf qual | forge | meta

      First run: pitf config init, then pitf doctor
